<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkBuddy">
<meta name="theme-color" content="#1A3C2A">
<meta name="description" content="WorkBuddy · 森系像素个人工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="stylesheet" href="style.css">
<title>WorkBuddy · 森系像素工作台</title>
</head>
<body>

<!-- ===== 启动页 ===== -->
<div id="splash">
  <div class="splash-icon">
    <svg viewBox="0 0 24 24" width="96" height="96" shape-rendering="crispEdges">
      <!-- 像素苹果 -->
      <rect x="6" y="6" width="12" height="1" fill="#D64550"/>
      <rect x="5" y="7" width="1" height="1" fill="#D64550"/>
      <rect x="18" y="7" width="1" height="1" fill="#D64550"/>
      <rect x="4" y="8" width="1" height="1" fill="#D64550"/>
      <rect x="19" y="8" width="1" height="1" fill="#D64550"/>
      <rect x="3" y="9" width="2" height="1" fill="#D64550"/>
      <rect x="19" y="9" width="2" height="1" fill="#D64550"/>
      <rect x="3" y="10" width="3" height="1" fill="#D64550"/>
      <rect x="18" y="10" width="3" height="1" fill="#D64550"/>
      <rect x="3" y="11" width="3" height="1" fill="#D64550"/>
      <rect x="18" y="11" width="3" height="1" fill="#D64550"/>
      <rect x="3" y="12" width="2" height="1" fill="#D64550"/>
      <rect x="19" y="12" width="2" height="1" fill="#D64550"/>
      <rect x="4" y="13" width="1" height="1" fill="#D64550"/>
      <rect x="19" y="13" width="1" height="1" fill="#D64550"/>
      <rect x="5" y="14" width="1" height="1" fill="#D64550"/>
      <rect x="18" y="14" width="1" height="1" fill="#D64550"/>
      <rect x="6" y="15" width="12" height="1" fill="#D64550"/>
      <rect x="6" y="5" width="1" height="1" fill="#D64550"/>
      <rect x="11" y="3" width="2" height="2" fill="#3D2C1B"/>
      <rect x="13" y="2" width="4" height="1" fill="#5A7A4A"/>
      <rect x="17" y="3" width="2" height="1" fill="#5A7A4A"/>
      <rect x="15" y="4" width="3" height="1" fill="#5A7A4A"/>
      <!-- 小狗 -->
      <rect x="16" y="20" width="4" height="2" fill="#8B6F47"/>
      <rect x="19" y="19" width="2" height="1" fill="#8B6F47"/>
      <rect x="17" y="22" width="1" height="1" fill="#3D2C1B"/>
      <rect x="15" y="22" width="6" height="2" fill="#8B6F47"/>
      <rect x="14" y="21" width="1" height="2" fill="#8B6F47"/>
    </svg>
  </div>
  <div class="splash-title">
    森系像素工作台
    <small>天地通 · 一通 · 日事通 · 万事皆成</small>
  </div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app">

  <aside id="sidebar">
    <div class="sb-brand" id="toggle-sidebar">
      <svg viewBox="0 0 24 24" width="22" height="22" shape-rendering="crispEdges">
        <rect x="6" y="6" width="12" height="12" fill="#D64550"/>
        <rect x="11" y="3" width="2" height="3" fill="#FDF8EC"/>
        <rect x="13" y="2" width="4" height="1" fill="#7DBF8A"/>
      </svg>
      <span class="label-text">WorkBuddy</span>
    </div>
    <nav class="nav-list">
      <div class="nav-item active" data-view="today">
        <span class="nav-icon">🏠</span><span class="label">今日中枢</span>
      </div>
      <div class="nav-item" data-view="gk">
        <span class="nav-icon">🎯</span><span class="label">考公专项</span>
      </div>
      <div class="nav-item" data-view="cycle">
        <span class="nav-icon">🩸</span><span class="label">生理周期</span>
      </div>
      <div class="nav-item" data-view="money">
        <span class="nav-icon">💰</span><span class="label">财富工坊</span>
      </div>
      <div class="nav-item" data-view="time">
        <span class="nav-icon">💝</span><span class="label">时光胶囊</span>
      </div>
      <div class="nav-item" data-view="remind">
        <span class="nav-icon">⏰</span><span class="label">智能提醒</span>
      </div>
      <div class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span><span class="label">设置</span>
      </div>
    </nav>
    <div class="sb-footer">v11.0<br>森系像素</div>
  </aside>

  <main id="content">
    <div class="page-header">
      <div>
        <div class="page-title" id="page-title">今日中枢</div>
        <div class="page-sub" id="page-sub">2026-08-02 · 周日</div>
      </div>
      <div class="page-actions" id="page-actions"></div>
    </div>
    <div class="page-body" id="page-body"></div>
  </main>
</div>

<!-- ===== 模态框 ===== -->
<div id="modal-root"></div>

<!-- ===== Toast ===== -->
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
